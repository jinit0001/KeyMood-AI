<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; font-family: Inter, Segoe UI, sans-serif; }
    body { margin: 0; background: transparent; color: #fff; }
    .wrap { display: grid; gap: 12px; width: 100%; }
    textarea { width: 100%; min-height: 180px; box-sizing: border-box; resize: vertical; padding: 16px; border: 1px solid rgba(255,255,255,.2); border-radius: 14px; background: rgba(20,20,22,.8); color: #fff; font: 15px/1.55 inherit; outline: none; }
    textarea:focus { border-color: #21d4c2; box-shadow: 0 0 0 3px rgba(33,212,194,.14); }
    button { justify-self: start; border: 0; border-radius: 999px; padding: 11px 20px; background: #fff; color: #111; font: 600 14px inherit; cursor: pointer; }
    button:hover { background: #21d4c2; }
    .privacy { color: rgba(255,255,255,.62); font-size: 12px; }
    @media (max-width: 480px) {
      .wrap { gap: 10px; }
      textarea { min-height: 150px; padding: 13px; font-size: 16px; }
      .privacy { line-height: 1.45; }
      button { width: 100%; padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <textarea id="typing-input" placeholder="Type your message here..."></textarea>
    <div class="privacy">Only typing statistics are sent for analysis. Your words stay in this browser.</div>
    <button id="analyze" type="button">Analyze typing pattern</button>
  </div>
  <script>
    const input = document.getElementById('typing-input');
    const button = document.getElementById('analyze');
    let startedAt = null;
    let lastKeyAt = null;
    let intervals = [];
    let keyCount = 0;
    let backspaces = 0;
    let corrections = 0;
    let pauses = 0;

    function sendMessage(type, value) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...value }, '*');
    }

    function setFrameHeight() {
      sendMessage('streamlit:setFrameHeight', { height: document.body.scrollHeight });
    }

    sendMessage('streamlit:componentReady', { apiVersion: 1 });
    setFrameHeight();
    window.addEventListener('resize', setFrameHeight);

    input.addEventListener('keydown', (event) => {
      const now = performance.now();
      if (startedAt === null) startedAt = now;
      if (lastKeyAt !== null) {
        const delay = now - lastKeyAt;
        intervals.push(delay);
        if (delay > 1500) pauses += 1;
      }
      lastKeyAt = now;
      keyCount += 1;
      if (event.key === 'Backspace' || event.key === 'Delete') {
        backspaces += 1;
        corrections += 1;
      }
    });

    button.addEventListener('click', () => {
      const elapsedMs = startedAt === null ? 0 : Math.max(performance.now() - startedAt, 1);
      const activeIntervals = intervals.filter((value) => value > 0 && value < 10000);
      const meanDelayMs = activeIntervals.length
        ? activeIntervals.reduce((sum, value) => sum + value, 0) / activeIntervals.length
        : 0;
      const variance = activeIntervals.length
        ? activeIntervals.reduce((sum, value) => sum + Math.pow(value - meanDelayMs, 2), 0) / activeIntervals.length
        : 0;
      const characters = input.value.length;
      const words = input.value.trim() ? input.value.trim().split(/\s+/).length : 0;
      const minutes = elapsedMs / 60000;
      sendMessage('streamlit:setComponentValue', {
        value: {
          characters,
          words,
          key_count: keyCount,
          duration_ms: Math.round(elapsedMs),
          typing_speed_wpm: Number((words / Math.max(minutes, 1 / 60000)).toFixed(2)),
          mean_inter_key_delay_ms: Math.round(meanDelayMs),
          delay_variability_ms: Math.round(Math.sqrt(variance)),
          backspaces,
          corrections,
          pauses,
          submitted: true
        }
      });
    });
  </script>
</body>
</html>
